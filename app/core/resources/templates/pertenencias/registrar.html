{% extends "base.html" %}
{% block title %}Registrar pertenencia{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 600px;">
  <h2 class="mb-4 text-center">Registrar pertenencia</h2>
  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" name="nombre" class="form-control" required value="{{ form_data.nombre or '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Tipo</label>
      <input type="text" name="tipo" class="form-control" required value="{{ form_data.tipo or '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <input type="text" name="descripcion" class="form-control" value="{{ form_data.descripcion or '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Serial</label>
      <input type="text" name="serial" class="form-control" value="{{ form_data.serial or '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Foto (URL o ruta)</label>
      <input type="text" name="foto" class="form-control" value="{{ form_data.foto or '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Estado</label>
      <select name="estado" class="form-select">
        <option value="Activo" {% if form_data.estado == "Activo" %}selected{% endif %}>Activo</option>
        <option value="Inactivo" {% if form_data.estado == "Inactivo" %}selected{% endif %}>Inactivo</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary w-100">Registrar</button>
  </form>
  <div class="text-center mt-3">
    <a href="/usuario/{{ usuario.numero_documento.valor }}/pertenencias" class="btn btn-link">
      ← Volver al listado
    </a>
  </div>
</div>
{% endblock %}

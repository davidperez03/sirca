{% extends "base.html" %}
{% block title %}Reenviar enlace de activación{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <h2 class="mb-4 text-center">Reenviar enlace de activación</h2>

      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      <form method="post">
        <div class="mb-3">
          <label for="tipo_documento" class="form-label">Tipo de documento</label>
          <select id="tipo_documento" name="tipo_documento" class="form-select" required>
            <option value="">Seleccione...</option>
            {% for td in tipos_documento %}
              <option value="{{ td.value }}"
                {% if form_data.tipo_documento == td.value %}selected{% endif %}>
                {{ td.value }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label for="numero_documento" class="form-label">Número de documento</label>
          <input
            type="text"
            id="numero_documento"
            name="numero_documento"
            class="form-control"
            value="{{ form_data.numero_documento or '' }}"
            required
          >
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary">
            Reenviar enlace
          </button>
          <a href="{{ url_for('Mostrar formulario de login') }}" class="btn btn-link">
            Volver al login
          </a>
        </div>
      </form>

    </div>
  </div>
</div>
{% endblock %}

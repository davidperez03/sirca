<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Error de activación</title>
  <style>
    :root {
      --primary-color: #1e40af;
      --accent-color: #0ea5e9;
      --danger-color: #dc2626;
      --light-color: #f8fafc;
      --border-color: #e2e8f0;
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --text-primary: #0f172a;
      --text-muted: #64748b;
    }
    body {
      background: var(--light-color);
      font-family: 'Inter', Arial, sans-serif;
      color: var(--text-primary);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 1.2rem;
      box-shadow: var(--shadow-lg);
      padding: 2.5rem 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
      border: 1.5px solid var(--border-color);
    }
    .icon-error {
      width: 54px;
      height: 54px;
      margin-bottom: 1rem;
      color: var(--danger-color);
    }
    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.7rem 2.2rem;
      background: linear-gradient(90deg, var(--primary-color) 60%, var(--accent-color) 100%);
      color: #fff;
      border: none;
      border-radius: 2rem;
      font-weight: 700;
      font-size: 1.08rem;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(30,64,175,0.08);
      transition: background 0.2s;
    }
    .btn:hover {
      background: linear-gradient(90deg, var(--accent-color) 60%, var(--primary-color) 100%);
    }
    .msg {
      color: var(--danger-color);
      font-weight: 600;
      margin-bottom: 0.7rem;
      font-size: 1.2rem;
    }
    .text-muted {
      color: var(--text-muted);
      font-size: 1em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div>
      <svg class="icon-error" fill="none" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="22" fill="#fff" stroke="#dc2626" stroke-width="3"/>
        <path d="M24 15v10" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
        <circle cx="24" cy="32" r="2" fill="#dc2626"/>
      </svg>
    </div>
    <div class="msg">Error de activación</div>
    <div class="text-muted">{{ mensaje }}</div>
    <a href="/reenvio-activacion" class="btn">Reenviar enlace de activación</a>
  </div>
</body>
</html>

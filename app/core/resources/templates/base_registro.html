<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Registro de Usuario{% endblock %}</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- AOS Animations -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --color-primary: #0d6efd; /* Azul vibrante */
      --color-primary-dark: #084298;
      --color-bg: #f5f7fa;
      --color-card-bg: #ffffff;
      --color-text: #212529;
      --color-muted: #6c757d;
      --border-radius: 0.75rem;
      --transition-fast: 0.3s ease-in-out;
      --shadow-soft: 0 4px 15px rgba(13, 110, 253, 0.2);
      --shadow-hover: 0 8px 30px rgba(13, 110, 253, 0.35);
      --font-family: 'Inter', sans-serif;
    }

    /* Reset y base */
    body {
      font-family: var(--font-family);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      margin: 0;
    }

    .container {
      max-width: 480px;
      background: var(--color-card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-soft);
      padding: 3rem 2.5rem;
      margin: 1rem;
      transition: box-shadow var(--transition-fast);
    }
    .container:hover {
      box-shadow: var(--shadow-hover);
    }

    h2 {
      font-weight: 700;
      margin-bottom: 2rem;
      text-align: center;
      color: var(--color-primary-dark);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      user-select: none;
    }

    form label {
      font-weight: 600;
      color: var(--color-primary-dark);
      user-select: none;
    }

    /* Inputs y selects */
    .form-control, .form-select {
      border-radius: var(--border-radius);
      border: 1.8px solid #ced4da;
      padding: 0.65rem 1rem;
      font-size: 1rem;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: none;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 10px rgba(13, 110, 253, 0.35);
      outline: none;
      transition: var(--transition-fast);
    }

    /* Botón principal */
    .btn-primary {
      background: linear-gradient(135deg, #0d6efd, #084298);
      border: none;
      font-weight: 700;
      width: 100%;
      padding: 0.75rem 0;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-soft);
      transition: background 0.4s ease, box-shadow 0.3s ease;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .btn-primary:hover, .btn-primary:focus {
      background: linear-gradient(135deg, #084298, #0d6efd);
      box-shadow: var(--shadow-hover);
      outline: none;
    }

    /* Alertas */
    .alert {
      border-radius: var(--border-radius);
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 0.75rem 1rem;
    }

    /* Lista requisitos contraseña */
    #requisitos-contrasena li {
      transition: color 0.4s ease;
      font-weight: 500;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--color-muted);
      user-select: none;
    }
    #requisitos-contrasena li.valid {
      color: #198754; /* verde bootstrap */
    }
    #requisitos-contrasena li i {
      transition: color 0.4s ease;
      font-size: 1.1rem;
    }
    #requisitos-contrasena li.valid i {
      color: #198754;
    }

    /* Mensaje confirmación */
    #mensaje-confirmacion {
      font-weight: 600;
      margin-top: 0.25rem;
      color: #dc3545; /* rojo bootstrap para error */
      user-select: none;
    }

    /* Animaciones AOS con 3D sutil */
    [data-aos] {
      opacity: 0;
      transform-style: preserve-3d;
      transform: translateY(20px) rotateX(5deg);
      transition-property: opacity, transform;
      transition-duration: 0.8s;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }
    [data-aos].aos-animate {
      opacity: 1;
      transform: translateY(0) rotateX(0);
    }

    /* Responsive */
    @media (max-width: 576px) {
      .container {
        padding: 2.5rem 1.5rem;
        margin: 1rem;
      }
    }

    /* Accesibilidad: foco claro */
    .form-control:focus-visible, .form-select:focus-visible, .btn-primary:focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 2px;
    }
  </style>

  {% block head_extra %}{% endblock %}
</head>
<body>

  {% block content %}
  <!-- Aquí va tu formulario con data-aos, por ejemplo: -->
  <div class="container" data-aos="fade-up">
    <h2>Registro de Usuario</h2>
    <form>
      <!-- Ejemplo campo -->
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre completo</label>
        <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required />
      </div>
      <!-- Más campos aquí -->
      <button type="submit" class="btn btn-primary">Registrarse</button>
    </form>
  </div>
  {% endblock %}

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- AOS -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 900,
      easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
      once: true,
    });
  </script>

  {% block scripts_extra %}{% endblock %}
</body>
</html>

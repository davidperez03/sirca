<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Autenticación{% endblock %}</title>
  
  <!-- Bootstrap & AOS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <style>
    :root {
      --primary-color: #1e40af;
      --primary-dark: #1e3a8a;
      --secondary-color: #64748b;
      --accent-color: #0ea5e9;
      --success-color: #059669;
      --warning-color: #d97706;
      --danger-color: #dc2626;
      --dark-color: #0f172a;
      --light-color: #f8fafc;
      --border-color: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    body {
      background-color: var(--light-color);
      font-family: 'Segoe UI', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 1200px;
      background-color: white;
      border-radius: 1rem;
      box-shadow: var(--shadow-md);
      overflow: hidden;
      margin: 1rem;
    }

    @media (min-width: 768px) {
      .auth-container {
        flex-direction: row;
        min-height: 600px;
      }
    }

    .auth-left {
      background-color: var(--primary-color);
      color: white;
      padding: 2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .auth-left h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .auth-left p {
      font-size: 1.1rem;
      color: #cbd5e1;
    }

    .auth-right {
      flex: 1;
      padding: 2rem;
      background-color: var(--light-color);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card-auth {
      background: white;
      padding: 2rem;
      border-radius: 0.75rem;
      box-shadow: var(--shadow-md);
      width: 100%;
      max-width: 420px;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 0.2rem rgba(14, 165, 233, 0.25);
    }

    .btn-primary {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }

    .btn-primary:hover {
      background-color: var(--primary-dark);
      border-color: var(--primary-dark);
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-left d-none d-md-flex text-center" data-aos="fade-right">
      <div>
        <h1>Bienvenido</h1>
        <p>{% block side_text %}Accede a tu cuenta o regístrate para comenzar{% endblock %}</p>
      </div>
    </div>

    <div class="auth-right" data-aos="fade-left">
      <div class="card-auth">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({ once: true, duration: 800 });
  </script>
</body>
</html>
